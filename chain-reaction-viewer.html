  const f=smooth((t-E.flag)/1.7);flag.position.y=.7+2.45*f;counterweight.position.y=3.25-2.45*f;
  moveLink(flagRope,[15.43,3.8,4.2],[15.43,flag.position.y,4.2]);moveLink(weightRope,[15.15,3.8,4.2],counterweight.position.toArray());
  moveLink(flagLatch,[16,.18,4.2],[15.15,3.25,4.2+.3*smooth((t-E.flag)/.2)]);
  bell.rotation.z=t>E.bell?.3*Math.sin((t-E.bell)*18)*Math.exp(-(t-E.bell)*1.4):0;
  const stages=[[0,'01 / Ball on rails'],[3.3,'02 / First domino cascade'],[SIM.trigger,'03 / Paddle releases striker'],[SIM.strike,'04 / Gong opens the gate'],[E.roll,'05 / Spiral descent'],[E.cup,'06 / Seesaw pulls the catch'],[E.launch,'07 / Catapult → receiving funnel'],[E.paddle,'08 / Paddle lowers the open cradle'],[E.pendulum,'09 / Pendulum released'],[E.wall,'10 / Wooden wall collapses'],[E.domino,'11 / Domino return'],[E.flag,'12 / Chain complete']];
  document.querySelector('#stage').textContent=stages.filter(s=>t>=s[0]).at(-1)[1];
}
const trackLen=track.getLength();
function poseAt(t){
  t=clamp(t,0,DURATION);
  if(t<=3.3){const u=clamp(Math.pow(t/3.3,1.25));ball.position.copy(track.getPointAt(u));ball.rotation.z=-u*trackLen/.38;}
  else{const q=t-3.3;ball.position.set(-.46-Math.min(.9,q*.35),Math.max(.385,1.05-1.6*q*q),Math.min(1.25,q*.37));ball.rotation.z=-trackLen/.38+q;}
  const f=t*SIM.fps,a=Math.min(SIM.frames.length-1,Math.floor(f)),b=Math.min(a+1,SIM.frames.length-1),fr=f-a;
  dominoes.forEach((p,i)=>{const angle=SIM.frames[a][i]+(SIM.frames[b][i]-SIM.frames[a][i])*fr;p.rotation.z=-Math.min(angle,i===17?LAST_REST:Math.PI/2);});
  latch.rotation.z=-paddleAngle(-dominoes[17].rotation.z);
  striker.rotation.z=strikerAngle(t,SIM.release,SIM.strike);
  const q=Math.max(0,t-SIM.strike), impact=t>=SIM.strike?Math.exp(-q*2.8):0;
  gongMat.emissiveIntensity=impact*.8; flare.intensity=impact*24;
  waves.forEach((o,i)=>{const p=(t-SIM.strike-i*.18);o.scale.setScalar(1+Math.max(0,p)*1.15);o.material.opacity=p>=0&&p<1.4?.38*(1-p/1.4):0;});
  poseExtension(t);
}

let time=0, playing=true, speed=1;
const slider=document.querySelector('#time'), tlabel=document.querySelector('#tlabel'), playBtn=document.querySelector('#play');
slider.addEventListener('input',()=>{playing=false;playBtn.textContent='Play';time=parseFloat(slider.value);poseAt(time);});
document.querySelector('#speed').addEventListener('change',e=>speed=parseFloat(e.target.value));
playBtn.addEventListener('click',()=>{playing=!playing; playBtn.textContent=playing?'Pause':'Play';});
document.querySelectorAll('#bar [data-t]').forEach(b=>b.addEventListener('click',()=>{playing=false;playBtn.textContent='Play';time=parseFloat(b.dataset.t);slider.value=time;poseAt(time);}));
document.querySelector('#spin').addEventListener('change',e=>controls.autoRotate=e.target.checked);
const views={overview:{p:[13,23,37],t:[10.5,1,.7]},ball:{p:[-4.5,3.4,5.2],t:[-4,1.6,0]},dominoes:{p:[4.5,2.6,5.4],t:[4.5,.8,0]},trigger:{p:[8.2,2.6,5.6],t:[11,1.1,.8]},spiral:{p:[18.7,7.8,10.5],t:[15.5,2,0]},launch:{p:[20,5.8,7],t:[20,1.2,-1.6]},pendulum:{p:[29.5,6,6],t:[25.5,1.7,-1.3]},finale:{p:[23,12,19],t:[21.8,1,2.3]}};
document.querySelectorAll('#presets [data-view]').forEach(b=>b.addEventListener('click',()=>{const v=views[b.dataset.view];camera.position.set(...v.p);controls.target.set(...v.t);}));
document.querySelector('#export').addEventListener('click',()=>{
  poseAt(time); scene.updateMatrixWorld(true);
  new GLTFExporter().parse(scene,res=>{
    const blob=res instanceof ArrayBuffer?new Blob([res],{type:'model/gltf-binary'}):new Blob([JSON.stringify(res)],{type:'model/gltf+json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='chain-reaction-t'+time.toFixed(2)+'s.glb'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },err=>alert('Export failed: '+err),{binary:true});
});

function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);}
addEventListener('resize',resize); resize();
let soundContext=null,soundOn=false;
document.querySelector('#sound').addEventListener('click',async()=>{
  soundOn=!soundOn;if(soundOn){soundContext??=new AudioContext();await soundContext.resume();}
  document.querySelector('#sound').textContent=soundOn?'Sound on':'Sound off';
});
function chime(frequency,duration,volume){
  if(!soundOn||!soundContext)return;
  for(const [ratio,gain] of [[1,1],[2.76,.35],[5.4,.12]]){
    const o=soundContext.createOscillator(),g=soundContext.createGain(),now=soundContext.currentTime;
    o.frequency.value=frequency*ratio;g.gain.setValueAtTime(volume*gain,now);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g).connect(soundContext.destination);o.start(now);o.stop(now+duration);
  }
}
const soundEvents=[[SIM.strike,180,2.8,.12],[E.tip,450,.12,.05],[E.launch,600,.10,.04],[E.wall,95,.45,.08],[E.bell,880,1.8,.09],...finaleTiles.map(d=>[d.start,300,.045,.02])];
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing){const previous=time;time+=dt*speed;for(const [at,f,d,v] of soundEvents)if(previous<at&&time>=at)chime(f,d,v);if(time>DURATION)time=0;slider.value=time;}
  poseAt(time);
  tlabel.textContent=time.toFixed(2)+' s';
  controls.update(); renderer.render(scene,camera);
}
poseAt(0); requestAnimationFrame(loop);
</script>
</body>
